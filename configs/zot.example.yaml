# zot configuration.
#
# zot has no built-in provider and no default model: before a run can start,
# declare the provider under `provider:` (at the bottom), list the models it
# serves with their context windows, and set agent.model to the one to run. The
# system prompt (`prompt:`, further down) is required too. Every other field is
# optional. Copy this file to ~/.config/zot/config.yaml (or pass it with
# --config) and adjust as needed.
#
# Credentials: put the key DIRECTLY in the provider's api_key, or reference an
# environment variable with $VAR - either works. Nothing is read from a
# conventional variable on your behalf: a key is scoped to the host it was issued
# for, so the provider says which one it uses.

agent:
  # Model that drives the agent: a key under the provider's `models:`. This is
  # how you switch between the models the provider serves. There is no default.
  model: "my-model"

  # The one finite backstop on run length: the maximum number of plan/act/observe
  # cycles before the agent is forced to stop. Tool calls and time are unbounded
  # by default (see below); this is not.
  max_iterations: 1000000

  # A run ends only when the agent records an outcome, by calling the success or
  # failure tool - never because its prose sounds finished. max_settles is how
  # many times the agent is nudged to do so before the run is surfaced as
  # unsettled: how hard zot pushes the model to finish properly. Default 20.
  # max_settles: 20

  # Cap on the total number of tool calls across a run, independent of
  # iterations (one iteration can request several). Unbounded unless you set it -
  # max_iterations is the only finite default backstop.
  # max_calls: 5000

  # Cap on the wall-clock time of a run, as a duration ("30m", "2h", "90s").
  # Checked at each step, so a run stops soon after the deadline. Unbounded
  # unless you set it.
  # max_time: '30m'

  # Cap on the output tokens of a single model response. Unbounded unless you set
  # it - zot sends no limit, so the model produces its full output. Set it to
  # bound response length or per-turn cost.
  # max_tokens: 8192

  # Cap on a single tool result (a file read, a command's output), as a share of
  # the model's context window in percent, before it is truncated. Default 25.
  # One large result can overflow the whole request and be rejected outright, so
  # a model with a small window is bounded tighter on its own.
  # max_tool_output_percent: 25

  # The safety guards below rarely need touching - each default encodes a real
  # failure mode, so raise or lower them with care. Unlike calls and time, these
  # cannot be turned off; zero just means "use the default".
  #
  # Recovery attempts in a row - a truncated response, or a retriable provider
  # error - with no good turn between them. A turn that comes back whole resets
  # the count. Default 20.
  # max_continuations: 20
  #
  # Recovery attempts across the whole run, however they are spaced. Where
  # max_continuations catches a provider refusing right now, this catches one
  # that answers just often enough to keep resetting it while the run spends its
  # life retrying rather than working. Default 200.
  # max_recoveries: 200
  #
  # How many times the loop nudges the model out of a detected repetition before
  # giving up on it. Default 2.
  # max_cycles: 2
  #
  # Consecutive turns producing neither text nor a tool call before the run
  # bails. Default 3.
  # max_empties: 3

  # Short-term memory is the model's context window - the `context` every model
  # states under provider.models. Nothing is summarised: once a request reaches
  # context_soft percent of the window, the oldest message is forgotten on each
  # request; at context_hard percent as many are forgotten as it takes to stay
  # under it. Forgotten messages stay in the session log. Defaults 50 and 90.
  # context_soft: 50
  # context_hard: 90
  #
  # The plan is what the model keeps with its tasks tool. Every plan_nudge_every
  # iterations the model is reminded that the tool exists (default 5, negative
  # turns the reminders off). When forgetting leaves fewer than plan_min_turns
  # turns in the window and the model's last plan call is no longer among them,
  # the plan is posted to it again (default 5).
  # plan_nudge_every: 5
  # plan_min_turns: 5

# The system prompt every run starts from, a Go text/template. It can read, as
# {{ .Name }}:
#   Title Objective Acceptance Constraints      from the order's front matter
#   Tools                                       each tool's Name and Description
#   Workdir Date Model Provider                 facts about the run
#   Project                                     the AGENTS.md of the config and the project
#   Session                                     the log of this run, its long-term memory
# and the functions: file "path", env "NAME", inc N.
#
# Zot has no input channel, so the non-interactive contract below matters: an
# agent that asks a question is not answered but waits until a guard kills the
# run. Zot adds nothing to this text, so what it says is what the agent is told.
prompt: |
  You are zot, a fully autonomous software engineering agent operating inside a real working directory on the user's machine.

  This is a non-interactive session running in the background. No one is watching, and no questions or further guidance can be answered - you will receive NO further input. Complete the assigned task end to end on your own, using your tools.

  Your tools:
  {{- range .Tools }}
  - "{{ .Name }}": {{ .Description }}
  {{- end }}

  Operating rules:
  - Begin by calling "tasks" to list the concrete tasks the work needs, in the order you will do them.
  - Look before you change. Read the code you are about to touch, and read large files in ranges or filter them with grep, because a command's output is truncated at a size limit. After you change anything, build and run the tests, and fix what you broke.
  - Write files with a quoted heredoc (<<'EOF') so the shell does not expand what you wrote, and check the result afterwards with cat, sed -n or git diff.
  - Keep "tasks" current: mark a task in_progress when you begin it and done when it is finished, and mark it blocked, with a note saying why, when it cannot go on.
  - Never run interactive or long-lived commands.
  - Act, do not narrate. The deliverable is the changed working tree, not an explanation of it; there is no reader to address. Do not pause to summarize, interpret, or analyze tool output - keep working, and use "tasks" for status.

  ## Memory

  What you can see is short-term memory: your context window. When it fills, the oldest messages are forgotten, and you are not told which. Everything you have said and done - in this run and in any earlier run of this order - is kept, one JSON record per line, in the session log:

      {{ .Session }}

  Search it with your shell when you need something that is no longer in view: a file you read, a command's output, a decision you made. A message record looks like {"kind":"message","message":{"type":"user|bot|reasoning|activity","text":"...","activity":{"kind":"request|response","name":"...","arguments":"...","result":...}}}; a "meta" record opens each run and a "result" record closes it. Records can be large, so filter before you print - grep -n, tail -n, sed -n 'START,ENDp', or jq -c if it is installed - and never cat the whole file.

  ## Non-interactive contract

  Nothing you address to the user is delivered. There is no reader, no reply, and no approval on its way. A question you ask is discarded unheard, and a run that stops to wait for an answer waits until a guard kills it, losing the work it had not yet finished.

  - Never stop to wait for input, approval, permission or confirmation. No one can grant what you asked for, so asking and waiting is the one certain way to fail the task.
  - Never end your turn with a question, an offer, or a promise to continue once told to. Continue now instead.
  - Where the task is ambiguous or underspecified, decide it the way a careful engineer would, act on the decision, and record the assumption in a task's note and again in your final summary. A stated assumption is reviewable afterwards; an unasked question is not.
  - Only a terminal tool call ends the task: "success" with a summary when the objective is met, or "failure" with the reason when it genuinely cannot be. Uncertainty is not a reason to stop - it is a reason to choose, act, and say what you chose. Do not simply stop.
  {{- if .Project }}

  # Project context

  {{ .Project }}
  {{- end }}

  ## Your task

  {{ .Objective }}
  {{- if .Acceptance }}

  Acceptance criteria - the objective is not met until every one of these holds:
  {{- range $index, $criterion := .Acceptance }}
  {{ inc $index }}. {{ $criterion }}
  {{- end }}
  {{- end }}
  {{- if .Constraints }}

  Constraints - these hold for the whole run:
  {{- range .Constraints }}
  - {{ . }}
  {{- end }}
  {{- end }}

# Presentation.
ui:
  # How many log lines the full-screen viewer keeps on screen. Default 5000;
  # raise it to keep more of a long run in the scrollback (at more memory). The
  # full, untrimmed run is always in the session log regardless.
  # scrollback: 5000

# Skills: a folder of subdirectories, each holding a SKILL.md - front matter with
# a name and a short description, then the instructions. They are read into
# memory at startup and offered to the model through a "skills" tool: it lists
# them with their descriptions, and reads one in full when it decides it applies.
# "~/" is your home directory; a relative path is taken against --dir.
# skills_dir: ~/.config/zot/skills

# The provider: the one inference connection every run uses - a direct model
# service, a local server, or a gateway. None is built in. The viewer and the
# session log call it by the host of its base_url.
provider:
  # Any endpoint that speaks the OpenAI chat-completions API. base_url is
  # required and must be https (unless loopback); the key is required too, since
  # zot will not forward a credential issued for one host to another.
  base_url: 'https://gateway.internal.example.com/v1'
  api_key: '$GATEWAY_KEY'

  # The models this provider serves. Required: agent.model must name one of
  # these keys, and every entry must state its context window. Each entry can
  # alias the provider's real model ID and override its run settings.
  models:
    my-model:
      # The model's total context window, in tokens. Required. zot keeps no
      # table of what models can take, so state the real ceiling of the
      # endpoint being served, which can be smaller than the model's card.
      # Older messages are forgotten to keep the conversation within it.
      context: 128000
      # the real model ID, when this key is only an alias for it
      # model: 'gpt-5.4-mini'
      # max_iterations: 50
      # send every message's content as an array of parts, for llama.cpp
      # templates that reject a bare string
      # content_array: true
      # reasoning_effort sent with every request: none, minimal, low, medium,
      # high, xhigh or max. Left out, the model's own default applies.
      # reasoning_effort: low
      # extra_body is merged into the request body as written - for whatever
      # the server takes that has no key here, such as a chat-template switch
      # that turns thinking off on a local server.
      # extra_body:
      #   chat_template_kwargs:
      #     enable_thinking: false

    # a second model on the same provider: set agent.model to switch to it
    # my-other-model:
    #   context: 32000

  # A local server needs no key:
  # base_url: 'http://localhost:11434/v1'
