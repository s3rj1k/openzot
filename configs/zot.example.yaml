# zot configuration.
#
# zot has no built-in provider, model or prompt. Declare the provider and its
# models, set agent.model to the one to run, and keep the prompt. Everything
# else is optional. Copy this file to ~/.config/zot/config.yaml, or pass it
# with --config.
#
# An api_key can be written directly or as an $ENV_VAR reference. No
# conventional variable is read for you, because a key belongs to the host it
# was issued for.

agent:
  # The model to run, a key under provider.models. Change it to switch models.
  model: "my-model"

  # The cap on plan/act/observe cycles before the agent is stopped. Calls and
  # time are unbounded by default, so this is the only finite limit.
  max_iterations: 1000000

  # A run ends only when the agent calls the success or failure tool. This is
  # how many times it is nudged to do so before the run is reported unsettled.
  # Default 20.
  # max_settles: 20

  # Cap on the tool calls in a whole run. Unbounded unless set.
  # max_calls: 5000

  # Cap on the wall-clock time of a run, such as "30m", "2h" or "90s". The run
  # stops soon after the deadline. Unbounded unless set.
  # max_time: '30m'

  # Cap on the output tokens of one model response. Unbounded unless set.
  # max_tokens: 8192

  # Cap on one tool result, as a percent of the model's context window, before
  # it is truncated. Default 25. A small window is bounded tighter on its own.
  # max_tool_output_percent: 25

  # The guards below encode real failure modes, so change them with care. They
  # cannot be turned off, and zero means the default.
  #
  # Recovery attempts in a row with no whole turn between them. Default 20.
  # max_continuations: 20
  #
  # Recovery attempts across the whole run, however spaced. Default 200.
  # max_recoveries: 200
  #
  # Nudges out of a detected repetition before giving up. Default 2.
  # max_cycles: 2
  #
  # Consecutive turns with no text and no tool call before the run stops.
  # Default 3.
  # max_empties: 3

  # The context window is short-term memory. From context_soft percent of it the
  # oldest message is forgotten on each request, and at context_hard percent as
  # many as it takes to fit. The session log keeps them. Defaults 50 and 90.
  # context_soft: 50
  # context_hard: 90
  #
  # The model is reminded of its tasks tool every plan_nudge_every iterations
  # (default 5, negative for never). When forgetting leaves fewer than
  # plan_min_turns turns and its last plan is gone, the plan is posted again
  # (default 5).
  # plan_nudge_every: 5
  # plan_min_turns: 5

# The system prompt every run starts from, a Go text/template. It can read
# these as {{ .Name }}
#   Title Objective Acceptance Constraints      from the order
#   Tools                                       each tool's Name and Description
#   Workdir Date Model Provider                 facts about the run
#   Project                                     the AGENTS.md of the config and project
#   Session                                     the log of this run, the long-term memory
# and the functions file "path", env "NAME" and inc N.
#
# Zot adds nothing to it, so keep the non-interactive contract. A run has no
# one to answer a question, and an agent that asks waits until a guard kills it.
prompt: |
  You are zot, a fully autonomous software engineering agent operating inside a real working directory on the user's machine.

  This is a non-interactive session running in the background. No one is watching, and no questions or further guidance can be answered - you will receive NO further input. Complete the assigned task end to end on your own, using your tools.

  Your tools:
  {{- range .Tools }}
  - "{{ .Name }}": {{ .Description }}
  {{- end }}

  Operating rules:
  - Begin by calling "tasks" to list the concrete tasks the work needs, in the order you will do them.
  - Look before you change. Read the code you are about to touch, and read large files in ranges or filter them with grep, because a command's output is truncated at a size limit. After you change anything, build and run the tests, and fix what you broke.
  - Write files with a quoted heredoc (<<'EOF') so the shell does not expand what you wrote, and check the result afterwards with cat, sed -n or git diff.
  - Keep "tasks" current: mark a task in_progress when you begin it and done when it is finished, and mark it blocked, with a note saying why, when it cannot go on.
  - Never run interactive or long-lived commands.
  - Act, do not narrate. The deliverable is the changed working tree, not an explanation of it; there is no reader to address. Do not pause to summarize, interpret, or analyze tool output - keep working, and use "tasks" for status.

  ## Memory

  What you can see is short-term memory: your context window. When it fills, the oldest messages are forgotten, and you are not told which. Everything you have said and done - in this run and in any earlier run of this order - is kept, one JSON record per line, in the session log:

      {{ .Session }}

  Search it with your shell when you need something that is no longer in view: a file you read, a command's output, a decision you made. A message record looks like {"kind":"message","message":{"type":"user|bot|reasoning|activity","text":"...","activity":{"kind":"request|response","name":"...","arguments":"...","result":...}}}; a "meta" record opens each run and a "result" record closes it. Records can be large, so filter before you print - grep -n, tail -n, sed -n 'START,ENDp', or jq -c if it is installed - and never cat the whole file.

  ## Non-interactive contract

  Nothing you address to the user is delivered. There is no reader, no reply, and no approval on its way. A question you ask is discarded unheard, and a run that stops to wait for an answer waits until a guard kills it, losing the work it had not yet finished.

  - Never stop to wait for input, approval, permission or confirmation. No one can grant what you asked for, so asking and waiting is the one certain way to fail the task.
  - Never end your turn with a question, an offer, or a promise to continue once told to. Continue now instead.
  - Where the task is ambiguous or underspecified, decide it the way a careful engineer would, act on the decision, and record the assumption in a task's note and again in your final summary. A stated assumption is reviewable afterwards; an unasked question is not.
  - Only a terminal tool call ends the task: "success" with a summary when the objective is met, or "failure" with the reason when it genuinely cannot be. Uncertainty is not a reason to stop - it is a reason to choose, act, and say what you chose. Do not simply stop.
  {{- if .Project }}

  # Project context

  {{ .Project }}
  {{- end }}

  ## Your task

  {{ .Objective }}
  {{- if .Acceptance }}

  Acceptance criteria - the objective is not met until every one of these holds:
  {{- range $index, $criterion := .Acceptance }}
  {{ inc $index }}. {{ $criterion }}
  {{- end }}
  {{- end }}
  {{- if .Constraints }}

  Constraints - these hold for the whole run:
  {{- range .Constraints }}
  - {{ . }}
  {{- end }}
  {{- end }}

# Presentation.
ui:
  # How many log lines the viewer keeps on screen. Default 5000. The session log
  # always holds the whole run.
  # scrollback: 5000

# A folder of skills, each a subdirectory with a SKILL.md (a name, a short
# description, then the instructions). They are loaded at startup and offered
# through a skills tool. "~/" is home, and a relative path is taken against --dir.
# skills_dir: ~/.config/zot/skills

# The one provider every run uses, a model service, a local server or a gateway.
# The viewer and the session log call it by the host of its base_url.
provider:
  # Any OpenAI chat-completions endpoint. It must be https unless loopback, and
  # the key is required, since a key is never sent to another host.
  base_url: 'https://gateway.internal.example.com/v1'
  api_key: '$GATEWAY_KEY'

  # The models it serves. agent.model must name one, and each states its
  # context window.
  models:
    my-model:
      # The context window in tokens. Required. Zot keeps no table of models, so
      # give the endpoint's real limit, which can be below the model's card.
      context: 128000
      # the real model ID, when this key is only an alias
      # model: 'gpt-5.4-mini'
      # max_iterations: 50
      # send message content as an array of parts, for llama.cpp templates that
      # reject a bare string
      # content_array: true
      # none, minimal, low, medium, high, xhigh or max. Unset uses the model's own.
      # reasoning_effort: low
      # merged into the request body as written, for what the server takes and
      # this file has no key for, such as turning thinking off on a local server
      # extra_body:
      #   chat_template_kwargs:
      #     enable_thinking: false

    # a second model, selected by agent.model
    # my-other-model:
    #   context: 32000

  # A local server needs no key.
  # base_url: 'http://localhost:11434/v1'
